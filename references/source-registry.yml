#   scope:          core | context
#   paywalled:      yes | no
#   url:            canonical URL
#   archive_url:    archive.org URL (optional)
#   notes:          brief description
#
# RULES:
#   - Core claims → tier 1 AND (primary OR secondary) ONLY
#   - Tier-3 → forbidden for core claims
#   - paywalled=yes core claims must have a non-paywalled companion

