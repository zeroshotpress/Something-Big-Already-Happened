<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF6B35"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="nodeFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D1A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1A1A2E;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#E8E8F0" font-family="sans-serif" font-size="22" font-weight="bold">The Recursive AI Improvement Loop</text>
  <text x="400" y="70" text-anchor="middle" fill="#9CA3AF" font-family="sans-serif" font-size="13">AI systems building better AI systems</text>

  <!-- Circular arrow path (invisible, for reference) -->
  <!-- We place 4 nodes around an ellipse centered at (400, 330) -->

  <!-- Node 1: Model N (top) -->
  <rect x="310" y="120" width="180" height="60" rx="12" ry="12" fill="url(#nodeFill)" stroke="#FF6B35" stroke-width="2" filter="url(#glow)"/>
  <text x="400" y="147" text-anchor="middle" fill="#E8E8F0" font-family="sans-serif" font-size="15" font-weight="bold">Model N</text>
  <text x="400" y="167" text-anchor="middle" fill="#9CA3AF" font-family="sans-serif" font-size="11">Current frontier model</text>

  <!-- Node 2: Writes Training Code (right) -->
  <rect x="570" y="270" width="190" height="60" rx="12" ry="12" fill="url(#nodeFill)" stroke="#FF6B35" stroke-width="2" filter="url(#glow)"/>
  <text x="665" y="297" text-anchor="middle" fill="#E8E8F0" font-family="sans-serif" font-size="15" font-weight="bold">Writes Code</text>
  <text x="665" y="317" text-anchor="middle" fill="#9CA3AF" font-family="sans-serif" font-size="11">Training &amp; tooling code</text>

  <!-- Node 3: Trains Model N+1 (bottom) -->
  <rect x="310" y="420" width="180" height="60" rx="12" ry="12" fill="url(#nodeFill)" stroke="#FF6B35" stroke-width="2" filter="url(#glow)"/>
  <text x="400" y="447" text-anchor="middle" fill="#E8E8F0" font-family="sans-serif" font-size="15" font-weight="bold">Model N+1</text>
  <text x="400" y="467" text-anchor="middle" fill="#9CA3AF" font-family="sans-serif" font-size="11">More capable model</text>

  <!-- Node 4: Writes Better Code (left) -->
  <rect x="40" y="270" width="190" height="60" rx="12" ry="12" fill="url(#nodeFill)" stroke="#FF6B35" stroke-width="2" filter="url(#glow)"/>
  <text x="135" y="297" text-anchor="middle" fill="#E8E8F0" font-family="sans-serif" font-size="15" font-weight="bold">Writes Better Code</text>
  <text x="135" y="317" text-anchor="middle" fill="#9CA3AF" font-family="sans-serif" font-size="11">Improved training code</text>

  <!-- Arrow 1: Model N -> Writes Code (top-right to right) -->
  <path d="M 490 165 Q 570 180, 610 270" fill="none" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrowhead)" opacity="0.9"/>

  <!-- Arrow 2: Writes Code -> Model N+1 (right to bottom) -->
  <path d="M 640 330 Q 580 400, 490 435" fill="none" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrowhead)" opacity="0.9"/>

  <!-- Arrow 3: Model N+1 -> Writes Better Code (bottom to left) -->
  <path d="M 310 465 Q 230 480, 185 330" fill="none" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrowhead)" opacity="0.9"/>

  <!-- Arrow 4: Writes Better Code -> Model N (left to top) -->
  <path d="M 160 270 Q 220 180, 310 155" fill="none" stroke="#FF6B35" stroke-width="2.5" marker-end="url(#arrowhead)" opacity="0.9"/>

  <!-- Center annotation -->
  <text x="400" y="295" text-anchor="middle" fill="#FF6B35" font-family="sans-serif" font-size="28" font-weight="bold" opacity="0.3">&#x21BB;</text>
  <text x="400" y="320" text-anchor="middle" fill="#FF6B35" font-family="sans-serif" font-size="11" font-weight="bold" opacity="0.7">Recursive</text>
  <text x="400" y="335" text-anchor="middle" fill="#FF6B35" font-family="sans-serif" font-size="11" font-weight="bold" opacity="0.7">Improvement</text>

  <!-- Continuation indicator at bottom -->
  <text x="400" y="520" text-anchor="middle" fill="#6B7280" font-family="sans-serif" font-size="12" font-style="italic">Each generation produces more capable code for the next...</text>

  <!-- Version labels on arrows -->
  <text x="555" y="210" text-anchor="middle" fill="#9CA3AF" font-family="sans-serif" font-size="10" transform="rotate(30, 555, 210)">generates</text>
  <text x="595" y="400" text-anchor="middle" fill="#9CA3AF" font-family="sans-serif" font-size="10" transform="rotate(-30, 595, 400)">trains</text>
  <text x="225" y="415" text-anchor="middle" fill="#9CA3AF" font-family="sans-serif" font-size="10" transform="rotate(30, 225, 415)">produces</text>
  <text x="210" y="210" text-anchor="middle" fill="#9CA3AF" font-family="sans-serif" font-size="10" transform="rotate(-30, 210, 210)">improves</text>

  <!-- Bottom caption -->
  <text x="400" y="570" text-anchor="middle" fill="#6B7280" font-family="sans-serif" font-size="11">"GPT-5.3-Codex was instrumental in creating itself" -- OpenAI</text>
</svg>